services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gestamercado-postgres
    restart: always
    environment:
      POSTGRES_DB: gestamercadodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/01-init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql
      - ./GestaMercadoDB9_1.sql:/docker-entrypoint-initdb.d/02-dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestamercadodb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
