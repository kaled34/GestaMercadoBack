server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: gestamercado-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestamercadodb}?currentSchema=gesta,public&reWriteBatchedInserts=true
    username: ${DB_USER:gesta_app}
    password: ${DB_PASSWORD:gesta_app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GestaMercadoHikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      auto-commit: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: gesta
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

# Configuración técnica tipada de la plataforma GestaMercado
gesta:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}       # 30 minutos
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días
      issuer: "GestaMercado-Gobierno-Chiapas"
    rls:
      # Secreto simétrico de 32 bytes (64 caracteres hex) configurado en gesta.secreto_firma_sesion
      hmac-secret-hex: ${RLS_HMAC_SECRET_HEX:262cd226022fdb0a61a34b0db8200fdb4fdf357065158b0033f3a086005e7977}
      system-user-id: ${RLS_SYSTEM_USER_ID:00000000-0000-0000-0000-000000000001}
      enabled: ${RLS_ENABLED:true}
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 65536
      iterations: 3
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    fiscal:
      recargos-cron: ${FISCAL_RECARGOS_CRON:0 0 2 * * ?}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
